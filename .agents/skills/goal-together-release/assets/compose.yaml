name: goal-together
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goal_together
      POSTGRES_DB: goal_together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少服务器数据库密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U goal_together -d goal_together']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  app:
    image: ${APP_IMAGE:?缺少发布镜像}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://goal_together:${POSTGRES_PASSWORD}@postgres:5432/goal_together
      DEMO_DATABASE_URL: postgres://goal_together:${POSTGRES_PASSWORD}@postgres:5432/goal_together_demo
      GUOQI_DUAL: '1'
      GUOQI_DATA_DIR: /data/workbench
      BACKUP_DIR: /data/backups
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?缺少正式 HTTPS 地址}
      HOST: 0.0.0.0
      PORT: '4173'
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${APP_PORT:-4182}:4173'
    volumes:
      - app-data:/data/workbench
      - backups:/data/backups
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/formal/api/session').then(async r=>{const j=await r.json();process.exit(r.ok&&j.mode==='formal'&&!j.demo?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
volumes:
  postgres-data:
    labels:
      ltd.tywldx.goal-together.owner: goal-together-release
  app-data:
    labels:
      ltd.tywldx.goal-together.owner: goal-together-release
  backups:
    labels:
      ltd.tywldx.goal-together.owner: goal-together-release
