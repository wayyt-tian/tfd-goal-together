name: goal-together
services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    container_name: goal-together-postgres
    environment:
      POSTGRES_USER: goal_together
      POSTGRES_DB: goal_together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 npm run db:setup}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goal_together -d goal_together"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://goal_together:${POSTGRES_PASSWORD}@postgres:5432/${FORMAL_DATABASE_NAME:-goal_together}
      DEMO_DATABASE_URL: postgres://goal_together:${POSTGRES_PASSWORD}@postgres:5432/goal_together_demo
      GUOQI_DATA_DIR: /data/workbench
      HOST: 0.0.0.0
      PORT: 4173
      BACKUP_DIR: /data/backups
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-4182}:4173"
    volumes:
      - backups:/data/backups
      - app-data:/data/workbench
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  backups:
  app-data:
